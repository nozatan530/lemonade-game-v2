# プッシュと PR のたびに、テスト・型チェック・ビルドを自動で動かす
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: テスト・型チェック・ビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build # 型チェック（tsc）もふくむ

  emulator:
    name: セキュリティルールとsync（エミュレーター）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4 # Firebase のエミュレーターに Java が必要
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:emu
